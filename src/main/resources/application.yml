spring:
  application:
    name: bike-weather-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dublin_service?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dublin.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

# API配置
api:
  bike:
    url: https://api.jcdecaux.com/vls/v1/stations
    contract: dublin
    api-key: ${JCDECAUX_API_KEY:}
  weather:
    url: https://api.openweathermap.org/data/2.5
    lat: 53.3498006
    lon: -6.2602964
    app-id: ${OPENWEATHER_API_KEY:}
    units: metric

# 定时任务配置
schedule:
  bike:
    cron: "0 */5 * * * ?"  # 每5分钟
  weather:
    cron: "0 0 * * * ?"     # 每1小时
  cleanup:
    cron: "0 0 2 * * ?"     # 每天凌晨2点清理7天前数据

# Feign配置
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 60000
        loggerLevel: none

# 日志配置
logging:
  level:
    com.dublin.feign: INFO

# Swagger配置
springfox:
  documentation:
    swagger-ui:
      enabled: true
    enabled: true
